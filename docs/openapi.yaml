openapi: 3.0.3
info:
  title: CMS Rekam — Public & External API
  description: >
    Read-only API for the compro (company-profile) websites. No session — every
    request is authenticated by the `X-Api-Key` header, which also selects
    which company's content is served.


    Two surfaces share that key. `/v1/*` serves the tenant's own CMS content.
    `/v1/ext/*` serves databases owned by *other* systems — COAST (coastal and
    blue-carbon village surveys) and IKAN (fisheries trip records) — and
    differs in three ways worth knowing: it has its own rate limit
    (`DS_RATE_LIMIT`, default 120/min per IP) and response cache, it can answer
    `503` when a datasource has no credentials in the environment, and it is
    **not tenant-scoped** — any company's key reads the same rows.


    Prose versions of the same contract: docs/api-public.md and
    docs/api-external.md.
  version: "1.1"
servers:
  - url: https://cms.rekam.org/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - ApiKeyAuth: []

tags:
  - name: News
  - name: Events
  - name: Team
  - name: Publications
  - name: Partners
  - name: Milestones
  - name: Units
  - name: Settings
  - name: Contact
  - name: COAST
    description: >
      External datasource. Coastal and blue-carbon village surveys; only
      `verified` forms are ever exposed, the same rule `published` enforces for
      CMS content.
  - name: IKAN
    description: >
      External datasource. Fisheries trip, vessel, gear and catch records. This
      database has no verification column, so every row is eligible.
  - name: BSC
    description: >
      External datasource. Blue swimming crab and mud crab landings: trips, and
      the individual crabs measured on them. Only `trip_nontrip = 'TRIP'`
      records are ever read.
  - name: HIUPARI
    description: >
      External datasource. Shark and ray landings. A deliberately narrow
      surface: one species list and the length histogram it filters.
  - name: STSC
    description: >
      External datasource. National fisheries statistics, already aggregated
      upstream: one row per year per WPPNRI, 1990-2021. No trips and no
      individuals, so no chained dropdowns and no dates - the filters are the
      area, the commodity and a year range.

paths:
  /news:
    get:
      tags: [News]
      summary: List published news
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: program
          in: query
          description: Filter by related-program slug (only when the tenant's `news_programs` feature is on).
          schema: { type: string }
        - name: category
          in: query
          description: Filter by news category slug (either locale).
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /news/{slug}:
    get:
      tags: [News]
      summary: Get one published article by slug (either locale)
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/News' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /news-categories:
    get:
      tags: [News]
      summary: List news categories
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NewsCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /programs:
    get:
      tags: [News]
      summary: List news programs (taxonomy options) — only when `news_programs` is on
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Option' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /events:
    get:
      tags: [Events]
      summary: List published events
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: upcoming
          in: query
          description: '`1` to only include events that have not ended yet.'
          schema: { type: integer, enum: [0, 1] }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /events/{slug}:
    get:
      tags: [Events]
      summary: Get one published event by slug (either locale)
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK — `rundowns` is present only when the tenant's `event_rundown` feature is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /team:
    get:
      tags: [Team]
      summary: List active team members, grouped per level
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TeamLevelGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /publications:
    get:
      tags: [Publications]
      summary: List publications (only when the tenant's `publications` feature is on)
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: category
          in: query
          schema: { type: string }
        - name: featured
          in: query
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /partners:
    get:
      tags: [Partners]
      summary: List active partners, ordered for display
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /milestones:
    get:
      tags: [Milestones]
      summary: List active milestones (perikanan-only tenant)
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /units:
    get:
      tags: [Units]
      summary: List active units (rekam-only tenant)
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }

  /settings:
    get:
      tags: [Settings]
      summary: Merged site identity, socials, SEO defaults, map, and contact info
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /contact:
    post:
      tags: [Contact]
      summary: Submit the public contact form
      description: >
        `website` is a honeypot — leave it empty (hide it via CSS on the real
        form). A filled honeypot still returns 201 but silently writes nothing,
        so a bot is never told it was caught. `status`/`ip` are always set by
        the server and cannot be supplied by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
            example:
              name: Rina Hartati
              email: rina@example.com
              phone: '081234567890'
              subject: Pertanyaan
              message: Halo, saya ingin bertanya.
              website: ''
      responses:
        '201':
          description: Accepted (also returned when the honeypot silently discarded the submission).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Pesan Anda telah terkirim. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleOff' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ------------------------------------------------- External: COAST -------
  /ext/coast/statistik:
    get:
      tags: [COAST]
      summary: Totals across every village
      description: >
        Twelve flat metrics over all verified forms, current year against the
        one before it. The two figures a village summary derives —
        `luas_ekosistem_total` and `nilai_ekonomi_total` — are deliberately
        absent: both are sums whose parts mean different things at this scale.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pendataan: { $ref: '#/components/schemas/CoastCoverage' }
                      statistik: { $ref: '#/components/schemas/CoastStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/coast/desa:
    get:
      tags: [COAST]
      summary: Villages with verified data, and the point the map marks them at
      description: >
        Unpaginated and sorted by village name, case-insensitively: a map needs
        every marker at once. Region names come from the `wilayah` reference
        table, not from the free-text name columns on the forms, which disagree
        with each other for the same code.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CoastVillage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/coast/desa/{kode}:
    get:
      tags: [COAST]
      summary: Everything the map panel shows for one village
      parameters:
        - name: kode
          in: path
          required: true
          description: The village's wilayah code (`desa_kode`), e.g. `33.21.12.2011`. Not a form id.
          schema: { type: string, pattern: '^[0-9.]+$' }
          example: '33.21.12.2011'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CoastSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >
            No verified form exists for this village — deliberately a 404
            rather than an all-zero summary, which would look like data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/coast/kawasan-konservasi:
    get:
      tags: [COAST]
      summary: Marine protected areas
      description: >
        A reference table, not survey data: there is no `verified` filter to
        apply, and an area no blue-carbon record points at yet is still listed.
        Unpaginated, sorted case-insensitively by name.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KawasanKonservasi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  # -------------------------------------------------- External: IKAN ------
  /ext/ikan/opsi/wppnri:
    get:
      tags: [IKAN]
      summary: 'Filter options: WPPNRI'
      description: The root of the chain — accepts no filters.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/provinsi:
    get:
      tags: [IKAN]
      summary: 'Filter options: province'
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/kabupaten:
    get:
      tags: [IKAN]
      summary: 'Filter options: regency/city'
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/lokasi-pendaratan:
    get:
      tags: [IKAN]
      summary: 'Filter options: landing site'
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/jenis-data:
    get:
      tags: [IKAN]
      summary: 'Filter options: dataset'
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/alat-tangkap:
    get:
      tags: [IKAN]
      summary: 'Filter options: fishing gear'
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/FilterJenisData'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/family:
    get:
      tags: [IKAN]
      summary: 'Filter options: family'
      description: >
        From `data_tangkapan_biologi`, which covers 9.247 of 10.619 trips. A
        trip that recorded no measurements is absent here — it belongs to no
        family — but is still counted by every level above this one.
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/FilterJenisData'
        - $ref: '#/components/parameters/FilterAlatTangkap'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/opsi/spesies:
    get:
      tags: [IKAN]
      summary: 'Filter options: species'
      description: As `family`, and additionally filterable by it.
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/FilterJenisData'
        - $ref: '#/components/parameters/FilterAlatTangkap'
        - $ref: '#/components/parameters/FilterFamily'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/grafik/trip:
    get:
      tags: [IKAN]
      summary: Trip counts per period and per landing site
      description: >
        Both chart series in one response, because both must describe the same
        filtered set of trips. Split across two endpoints, a client that forgot
        to pass one filter to one of them would get two charts that silently
        disagree.


        `alat_tangkap`, `family` and `spesies` are deliberately not accepted
        here: this chart counts trips, and those three either multiply a trip
        across rows or exclude trips that recorded no catch.
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/FilterJenisData'
        - name: tipe_tanggal
          in: query
          description: How `per_tanggal` is grouped.
          schema: { type: string, enum: [monthly, yearly], default: monthly }
        - name: dari
          in: query
          description: Earliest `tanggal_pendataan` to include, inclusive.
          schema: { type: string, format: date }
          example: '2025-01-01'
        - name: sampai
          in: query
          description: Latest `tanggal_pendataan` to include, inclusive. Must not precede `dari`.
          schema: { type: string, format: date }
          example: '2025-12-31'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/grafik/tangkapan:
    get:
      tags: [IKAN]
      summary: Total landed weight per species
      description: >
        What the catch is made of, in kilograms. Reads `data_tangkapan_catch` —
        not `data_tangkapan_biologi`, which measures individual fish and carries
        a different taxonomy.


        Unlike the trip chart this one accepts `alat_tangkap`: summing weights
        is unaffected by a trip appearing in several catch rows, whereas
        counting trips would be. There is no `tipe_tanggal` — the result is not
        a time series.
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/FilterJenisData'
        - $ref: '#/components/parameters/FilterAlatTangkap'
        - name: dari
          in: query
          description: Earliest `tanggal_pendataan` to include, inclusive.
          schema: { type: string, format: date }
          example: '2025-01-01'
        - name: sampai
          in: query
          description: Latest `tanggal_pendataan` to include, inclusive. Must not precede `dari`.
          schema: { type: string, format: date }
          example: '2025-12-31'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CatchChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/ikan/grafik/frekuensi-panjang:
    get:
      tags: [IKAN]
      summary: Length-frequency histogram, with Lc and Lm
      description: >
        The length distribution of measured fish at a class width of the
        caller's choosing, plus the indicators such a chart is read against.


        Lc is computed from the distribution; Lm cannot be, and is an input. See
        the `indikator` schema.
      parameters:
        - $ref: '#/components/parameters/FilterWppnri'
        - $ref: '#/components/parameters/FilterProvinsi'
        - $ref: '#/components/parameters/FilterKabupaten'
        - $ref: '#/components/parameters/FilterLokasiPendaratan'
        - $ref: '#/components/parameters/FilterJenisData'
        - $ref: '#/components/parameters/FilterAlatTangkap'
        - $ref: '#/components/parameters/FilterFamily'
        - name: spesies
          in: query
          schema: { type: string }
          example: Katsuwonus pelamis
        - name: dari
          in: query
          description: Earliest `tanggal_pendataan` to include, inclusive.
          schema: { type: string, format: date }
        - name: sampai
          in: query
          description: Latest `tanggal_pendataan` to include, inclusive. Must not precede `dari`.
          schema: { type: string, format: date }
        - name: tipe_panjang
          in: query
          description: >
            Absent means both, which is what was asked for — but fork length and
            total length measure different things, so check
            `komposisi_tipe_panjang` before reading a mixed histogram.
          schema: { type: string, enum: [TL, FL] }
        - name: selang_kelas
          in: query
          description: Class width, in the same unit as the lengths.
          schema: { type: number, format: double, minimum: 0.1, maximum: 50, default: 1 }
        - name: lm
          in: query
          description: >
            Length at maturity, from the literature for the species being
            filtered to. Not derivable from this database — see the `indikator`
            schema.
          schema: { type: number, format: double, minimum: 0.1, maximum: 500 }
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LengthFrequency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }


  # ---------------------------------------------------- External: BSC -----
  /ext/bsc/opsi/provinsi:
    get:
      tags: [BSC]
      summary: 'Filter options: province'
      description: >
        The root of the chain — accepts no filters.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/opsi/kabupaten:
    get:
      tags: [BSC]
      summary: 'Filter options: regency/city'
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/opsi/lokasi-pendaratan:
    get:
      tags: [BSC]
      summary: 'Filter options: landing site'
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/opsi/jenis-pendataan:
    get:
      tags: [BSC]
      summary: 'Filter options: dataset'
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/opsi/alat-tangkap:
    get:
      tags: [BSC]
      summary: 'Filter options: fishing gear'
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/BscJenisPendataan'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/opsi/jenis-tangkapan:
    get:
      tags: [BSC]
      summary: 'Filter options: catch type'
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/BscJenisPendataan'
        - $ref: '#/components/parameters/BscAlatTangkap'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/opsi/spesies:
    get:
      tags: [BSC]
      summary: 'Filter options: species'
      description: >
        From `data_biologi`. `jumlah_trip` still counts trips: a trip on which fifty crabs were measured counts once.
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/BscJenisPendataan'
        - $ref: '#/components/parameters/BscAlatTangkap'
        - $ref: '#/components/parameters/BscJenisTangkapan'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200': { $ref: '#/components/responses/OptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/grafik/trip:
    get:
      tags: [BSC]
      summary: Trip counts per period and per landing site
      description: >
        The BSC counterpart of `/ext/ikan/grafik/trip`, over `data_trip.tanggal`.


        `spesies` is not accepted: it lives on the crab table, which holds many
        rows per trip, so joining it would turn a trip count into a crab count
        and would drop the trips on which nothing was measured.
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/BscJenisPendataan'
        - $ref: '#/components/parameters/BscAlatTangkap'
        - $ref: '#/components/parameters/BscJenisTangkapan'
        - name: tipe_tanggal
          in: query
          description: How `per_tanggal` is grouped.
          schema: { type: string, enum: [monthly, yearly], default: monthly }
        - name: dari
          in: query
          description: Earliest `tanggal` to include, inclusive.
          schema: { type: string, format: date }
        - name: sampai
          in: query
          description: Latest `tanggal` to include, inclusive. Must not precede `dari`.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/grafik/tangkapan:
    get:
      tags: [BSC]
      summary: Catch composition per species, by measured weight
      description: >
        **A sample, not a landing.** BSC has no per-species catch table:
        `data_trip` holds whole-trip totals with no species breakdown, so the
        only figure attributable to a species is the weight of the individuals
        actually measured. Those two populations differ in size and in unit —
        about 22.115 in trip totals against about 6,63 million gram measured.
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/BscJenisPendataan'
        - $ref: '#/components/parameters/BscAlatTangkap'
        - $ref: '#/components/parameters/BscJenisTangkapan'
        - name: dari
          in: query
          schema: { type: string, format: date }
        - name: sampai
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BscCatchChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/bsc/grafik/frekuensi-lebar:
    get:
      tags: [BSC]
      summary: Carapace-width histogram, with Lc and Lm both computed
      description: >
        Unlike the IKAN length chart, Lm does not have to be supplied here: BSC
        records a gonad stage per individual, so the width at which half the
        crabs are mature is in the data. What still has to be decided is which
        stage counts as mature — see `tkg_matang`.
      parameters:
        - $ref: '#/components/parameters/BscProvinsi'
        - $ref: '#/components/parameters/BscKabupaten'
        - $ref: '#/components/parameters/BscLokasiPendaratan'
        - $ref: '#/components/parameters/BscJenisPendataan'
        - $ref: '#/components/parameters/BscAlatTangkap'
        - $ref: '#/components/parameters/BscJenisTangkapan'
        - $ref: '#/components/parameters/BscSpesies'
        - name: dari
          in: query
          schema: { type: string, format: date }
        - name: sampai
          in: query
          schema: { type: string, format: date }
        - name: jenis_kelamin
          in: query
          description: >
            Absent means both, plus the 83 rows whose sex could not be read.
            Values are normalised from the four spellings upstream uses.
          schema: { type: string, enum: [JANTAN, BETINA] }
        - name: selang_kelas
          in: query
          description: Class width, in the same unit as the widths.
          schema: { type: number, format: double, minimum: 0.1, maximum: 50, default: 1 }
        - name: tkg_matang
          in: query
          description: >
            Gonad stage at or above which a crab counts as mature. The default
            is 2: at 1 some 96,5% of crabs qualify and Lm collapses onto the
            smallest class, while at 3 only 11,1% do and no width class ever
            reaches half, so Lm comes back null for every query.
          schema: { type: integer, minimum: 1, maximum: 3, default: 2 }
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BscLengthFrequency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }


  # ------------------------------------------------ External: HIUPARI -----
  /ext/hiupari/opsi/spesies:
    get:
      tags: [HIUPARI]
      summary: 'Filter options: species'
      description: >
        Twenty species, alphabetically, unpaginated and unchained — species is
        the only dimension this surface filters on. `jumlah_individu` counts
        every animal of that species, not only those carrying one particular
        measurement.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string, example: Prionace glauca }
                        jumlah_individu: { type: integer, example: 247 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/hiupari/grafik/frekuensi-panjang:
    get:
      tags: [HIUPARI]
      summary: Length histogram for sharks and rays
      description: >
        Sharks and rays are measured five different ways and no column is
        filled in for every animal: all 7.558 Rhynchobatus australiae carry a
        total length, but only 21 of the 247 Prionace glauca do, while 88 of
        them carry a predorsal length. Locking the chart to one column would
        draw a blue-shark histogram from 8% of the blue sharks and look no
        different for it.


        So the measurement is a parameter, and the response always reports both
        how many animals it left out and what the alternatives would have
        yielded.
      parameters:
        - name: spesies
          in: query
          description: Absent means every species.
          schema: { type: string }
          example: Prionace glauca
        - name: jenis_kelamin
          in: query
          description: >
            Absent means both — and then `lm` is null, because clasper maturity
            is a male character.
          schema: { type: string, enum: [M, F] }
        - name: jenis_ukuran
          in: query
          description: >
            Default `panjang_total`, because total length is the conventional
            reporting measure for these animals — not because it is the most
            complete, which for several species it is not.
          schema:
            type: string
            enum: [panjang_total, precaudal_length, fork_length, predorsal_length, panjang_headless]
            default: panjang_total
        - name: selang_kelas
          in: query
          schema: { type: number, format: double, minimum: 0.1, maximum: 50, default: 1 }
        - name: kematangan_matang
          in: query
          description: >
            Clasper stage at or above which a male counts as mature. Upstream
            records 0 to 3; 158 rows carry values from 5 to 37, which are
            clasper lengths written into the maturity column and are treated as
            no stage at all.
          schema: { type: integer, minimum: 1, maximum: 3, default: 3 }
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HiupariLengthFrequency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/stsc/opsi/wpp:
    get:
      tags: [STSC]
      summary: 'Filter options: fisheries management areas'
      description: >
        The eleven WPPNRI, in natural order, unpaginated. `sumber` names the
        tables that carry the area: the two are filled independently upstream,
        so an area present in `produksi` but absent from `armada` would draw an
        empty fleet chart with nothing to explain it. On the data as it stands
        all eleven appear in both.
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string, example: '571' }
                        tahun_awal: { type: integer, example: 1990 }
                        tahun_akhir: { type: integer, example: 2021 }
                        sumber:
                          type: array
                          items: { type: string, enum: [armada, produksi] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/stsc/opsi/komoditas:
    get:
      tags: [STSC]
      summary: 'Filter options: commodities'
      description: >
        Eleven commodities, alphabetically — the same order `grafik/produksi`
        returns them in, so the axis and the dropdown that filters it agree.
        `jumlah_wpp` is how many areas land the commodity, and therefore how
        many lines its chart will draw.


        Note that `Rajungan`, `Kepiting` and `Rajungan-Kepiting` all exist as
        separate commodities: the combined category overlaps the other two, so
        the three must never be added together.
      parameters:
        - name: wpp
          in: query
          description: Narrows the list to one area. Absent means every area.
          schema: { type: string }
          example: '712'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string, example: Rajungan }
                        jumlah_wpp: { type: integer, example: 11 }
                        tahun_awal: { type: integer, example: 1990 }
                        tahun_akhir: { type: integer, example: 2021 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/stsc/grafik/armada:
    get:
      tags: [STSC]
      summary: Fleet size and fleet tonnage per area per year
      description: >
        Both series in one response: they are read against each other — a fleet
        that shrinks while its tonnage grows is the point of the chart — and
        two calls could answer from two different filters.


        Points are emitted only for years that carry a row. Unlike the trip
        charts of IKAN and BSC, a gap here is not filled with a zero: there a
        zero means "no trips", here it would mean the fleet disappeared, which
        is a different claim from "not reported".
      parameters:
        - $ref: '#/components/parameters/StscWpp'
        - $ref: '#/components/parameters/StscDariTahun'
        - $ref: '#/components/parameters/StscSampaiTahun'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StscArmadaChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }

  /ext/stsc/grafik/produksi:
    get:
      tags: [STSC]
      summary: Landed weight per commodity, one line per area
      description: >
        Nested by commodity, then by area: one panel per commodity, eleven
        lines in each. Narrowing to a single `wpp` keeps the same shape with
        one line per panel rather than a second shape to branch on.
      parameters:
        - $ref: '#/components/parameters/StscWpp'
        - name: komoditas
          in: query
          description: >
            Absent means every commodity. Free text rather than an enumeration:
            the eleven values are upstream's own vocabulary, not a standard.
          schema: { type: string, maxLength: 30 }
          example: Rajungan
        - $ref: '#/components/parameters/StscDariTahun'
        - $ref: '#/components/parameters/StscSampaiTahun'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StscProduksiChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/DatasourceUnavailable' }


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Issued from Pengaturan Situs › API Key in the CMS dashboard (super admin only). Shown once per rotation.

  parameters:
    Lang:
      name: lang
      in: query
      description: '`id` (default) or `en`. Blank translations fall back to Indonesian.'
      schema: { type: string, enum: [id, en], default: id }
    Fields:
      name: fields
      in: query
      description: Comma-separated top-level field names to include, e.g. `id,title`.
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 15 }

    # External datasources (/ext/*). Empty means "no filter", never "the empty
    # string" — a dropdown reset to its placeholder sends `provinsi=`.
    FilterWppnri:
      name: wppnri
      in: query
      schema: { type: string }
      example: WPPNRI-713
    FilterProvinsi:
      name: provinsi
      in: query
      schema: { type: string }
      example: SULAWESI SELATAN
    FilterKabupaten:
      name: kabupaten
      in: query
      schema: { type: string }
    FilterLokasiPendaratan:
      name: lokasi_pendaratan
      in: query
      description: Underscored, even though the path form is hyphenated.
      schema: { type: string }
    FilterJenisData:
      name: jenis_data
      in: query
      schema: { type: string }
    FilterAlatTangkap:
      name: alat_tangkap
      in: query
      description: >
        The trip's main gear, from `data_operasional_trip` — the same column
        `opsi/alat-tangkap` lists. The catch table carries a column of the same
        name whose values disagree on 1.110 of 17.900 rows and which does not
        share this vocabulary, so `alat_tangkap=X` means "landed by trips whose
        main gear was X", not "caught with X".
      schema: { type: string }
    FilterFamily:
      name: family
      in: query
      schema: { type: string }

    # BSC. Its chain starts at provinsi: that database records no WPPNRI.
    BscProvinsi:
      name: provinsi
      in: query
      schema: { type: string }
      example: JAWA TENGAH
    BscKabupaten:
      name: kabupaten
      in: query
      description: >
        Note that upstream holds both `DEMAK` and `KABUPATEN DEMAK` for the
        same regency; the two are deliberately not merged.
      schema: { type: string }
    BscLokasiPendaratan:
      name: lokasi_pendaratan
      in: query
      schema: { type: string }
    BscJenisPendataan:
      name: jenis_pendataan
      in: query
      description: The collection programme — BCAF, PANTURA, TELUK BANTEN, ARU.
      schema: { type: string }
    BscAlatTangkap:
      name: alat_tangkap
      in: query
      schema: { type: string }
    BscJenisTangkapan:
      name: jenis_tangkapan
      in: query
      description: RAJUNGAN, KEPITING, or both.
      schema: { type: string }
    BscSpesies:
      name: spesies
      in: query
      schema: { type: string }
      example: Portunus pelagicus
    StscWpp:
      name: wpp
      in: query
      description: >
        One of the eleven WPPNRI codes; absent means every area. Validated
        against that list, so an area upstream does not record answers 422
        rather than an empty chart that reads "no fleet there".
      schema:
        type: string
        enum: ['571', '572', '573', '711', '712', '713', '714', '715', '716', '717', '718']
      example: '712'
    StscDariTahun:
      name: dari_tahun
      in: query
      description: Inclusive lower bound. Data runs 1990-2021.
      schema: { type: integer, minimum: 1900, maximum: 2100 }
      example: 2015
    StscSampaiTahun:
      name: sampai_tahun
      in: query
      description: Inclusive upper bound; may not precede `dari_tahun`. Either bound may be given on its own.
      schema: { type: integer, minimum: 1900, maximum: 2100 }
      example: 2021

  responses:
    Unauthorized:
      description: Missing, invalid, or inactive-tenant API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'API key tidak valid atau tidak ditemukan.' }
    NotFound:
      description: No record matches.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ModuleOff:
      description: This module is not enabled for the resolved tenant — route does not exist for it (404, not an empty list).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }

    OptionList:
      description: >
        Distinct values still selectable under the filters supplied.
        Unpaginated, ordered alphabetically. A filter that does not apply to
        this level is ignored rather than rejected, so a client may keep its
        whole filter state and send it at every level.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/FilterOption' }
    DatasourceUnavailable:
      description: >
        This external datasource has no credentials in this environment. An
        operator problem, answered by name rather than as a connection timeout.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: "Sumber data 'COAST' tidak tersedia di lingkungan ini." }

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Option:
      type: object
      properties:
        value: { type: string }
        label: { type: string }

    NewsCategory:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }

    News:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        body: { type: string, nullable: true }
        meta_title: { type: string, nullable: true }
        meta_description: { type: string, nullable: true }
        category:
          type: object
          nullable: true
          properties:
            slug: { type: string }
            name: { type: string }
        related_programs:
          type: array
          items: { type: string }
          description: Present only when the tenant's `news_programs` feature is on.
        cover_url: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        author_name: { type: string, nullable: true }

    NewsListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/News' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    EventRundown:
      type: object
      properties:
        time: { type: string, nullable: true, example: '09:00' }
        title: { type: string }
        description: { type: string, nullable: true }

    Event:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        meta_title: { type: string, nullable: true }
        meta_description: { type: string, nullable: true }
