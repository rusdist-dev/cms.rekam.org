    Settings:
      type: object
      properties:
        name: { type: string }
        tagline: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        favicon_url: { type: string, nullable: true }
        meta_title: { type: string, nullable: true }
        meta_description: { type: string, nullable: true }
        og_image_url: { type: string, nullable: true }
        keywords:
          type: array
          items: { type: string }
        socials:
          type: object
          properties:
            instagram: { type: string, nullable: true }
            linkedin: { type: string, nullable: true }
            youtube: { type: string, nullable: true }
            facebook: { type: string, nullable: true }
            x: { type: string, nullable: true }
            tiktok: { type: string, nullable: true }
        map_embed: { type: string, nullable: true }
        contact:
          type: object
          properties:
            email: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            whatsapp: { type: string, nullable: true }
            address: { type: string, nullable: true }
            map_embed: { type: string, nullable: true }

    ContactRequest:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 32, nullable: true }
        subject: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 5000 }
        website:
          type: string
          description: Honeypot — must stay empty.
          default: ''

    # -- External: COAST -----------------------------------------------------
    Metric:
      type: object
      description: One statistic, with the current year (`baru`) against the previous one (`lama`).
      required: [key, label, unit, decimals, baru, lama]
      properties:
        key: { type: string, example: luas_ekosistem_total }
        label: { type: string, example: Total Luas Ekosistem }
        unit:
          type: string
          nullable: true
          description: >
            One of `ha`, `Rp`, `kg`, `unit`, `orang`, or `Mg C` — megagrams of
            carbon. That last one is not currency, despite the upstream column
            being named "nilai".
          example: ha
        decimals: { type: integer, example: 2 }
        baru: { type: number, format: double }
        lama: { type: number, format: double }
        children_sum_to_total:
          type: boolean
          description: >
            Present only alongside `children`. **Read this before summing.**
            `true` means the children are a complete decomposition — safe to
            add up, to chart as a whole, or to compute a remainder from.
            `false` means the parent is the reported figure and the children
            only the part that could be attributed, so summing them instead
            would be wrong. It is `false` for `luas_ekosistem_total`, where a
            row naming several ecosystems at once carries one area belonging to
            no single type, and for both `orang_*_total` metrics, whose age and
            gender categories overlap and which upstream allows to be filled in
            with no breakdown at all.
        children:
          type: array
          description: >
            Present only on metrics that decompose. The `dampak_ekonomi_*` pair
            nests two levels deep — activity, then commodity.
          items: { $ref: '#/components/schemas/Metric' }

    CoastStatistics:
      type: object
      properties:
        tahun_baru: { type: integer, example: 2026 }
        tahun_lama: { type: integer, example: 2025 }
        metrik:
          type: array
          description: >
            Fixed order. A village summary returns nine top-level metrics, four
            of which carry `children`; `/ext/coast/statistik` returns twelve
            flat ones and never any children.
          items: { $ref: '#/components/schemas/Metric' }

    CoastCoverage:
      type: object
      description: How much data stands behind the totals — all-time, not the two-year window.
      properties:
        jumlah_form: { type: integer, example: 81 }
        jumlah_desa: { type: integer, example: 19 }
        terakhir: { type: string, format: date, nullable: true, example: '2026-07-25' }

    CoastRegion:
      type: object
      description: >
        Names come from the `wilayah` reference table; a form's own free-text
        name columns are only a last-resort fallback, because they disagree
        with each other for the same code.
      properties:
        desa_kode: { type: string, example: '33.21.12.2011' }
        desa: { type: string, nullable: true, example: Purworejo }
        kecamatan_kode: { type: string, nullable: true, example: '33.21.12' }
        kecamatan: { type: string, nullable: true, example: Bonang }
        kabupaten_kode: { type: string, nullable: true, example: '33.21' }
        kabupaten_kota: { type: string, nullable: true, example: Kabupaten Demak }
        provinsi_kode: { type: string, nullable: true, example: '33' }
        provinsi: { type: string, nullable: true, example: Jawa Tengah }

    CoastVillage:
      allOf:
        - $ref: '#/components/schemas/CoastRegion'
        - type: object
          properties:
            koordinat:
              type: object
              nullable: true
              description: >
                Null — not `0,0` — when the village has no boundary row. A
                marker at null island looks like data.
              properties:
                lat: { type: number, format: double, example: -6.8201893594804 }
                lng: { type: number, format: double, example: 110.56238796756 }
            jumlah_form: { type: integer, example: 5 }
            pendataan_terakhir: { type: string, format: date, nullable: true, example: '2026-07-19' }

    CoastBoundary:
      type: object
      nullable: true
      properties:
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        luas: { type: number, format: double, nullable: true }
        penduduk: { type: integer, nullable: true }
        path:
          type: array
          description: >
            Polygon rings, already decoded. Points are **[lat, lng]** — the
            opposite order to GeoJSON, and what Leaflet expects.
          items:
            type: array
            items:
              type: array
              items: { type: number, format: double }
              minItems: 2
              maxItems: 2

    CoastSummary:
      type: object
      properties:
        wilayah: { $ref: '#/components/schemas/CoastRegion' }
        peta: { $ref: '#/components/schemas/CoastBoundary' }
        pendataan:
          type: object
          properties:
            jumlah_form: { type: integer }
            terakhir: { type: string, format: date, nullable: true }
        statistik: { $ref: '#/components/schemas/CoastStatistics' }
        gambar:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              keterangan: { type: string, nullable: true }
        rehabilitasi:
          type: array
          description: Full history, newest first, capped at 100 — not the two-year window.
          items: { $ref: '#/components/schemas/CoastRehabilitation' }
        pelatihan:
          type: array
          description: >
            Full history, newest first, capped at 100. Legitimately empty
            today: the upstream `coast_kegiatan` table holds no rows yet, even
            though participant totals do appear among the statistics above.
          items: { $ref: '#/components/schemas/CoastTraining' }

    CoastRehabilitation:
      type: object
      properties:
        tanggal: { type: string, format: date, nullable: true }
        ekosistem: { type: string, nullable: true }
        status_lahan: { type: string, nullable: true }
        luas_area_direhabilitasi: { type: number, format: double, nullable: true }
        pelaksana: { type: string, nullable: true }
        kolaborator: { type: string, nullable: true }
        jumlah_bibit: { type: integer, nullable: true }
        survival_rate: { type: number, format: double, nullable: true }

    CoastTraining:
      type: object
      properties:
        tanggal: { type: string, format: date, nullable: true }
        nama: { type: string, nullable: true }
        peserta: { type: integer, nullable: true }
        peserta_pria: { type: integer, nullable: true }
        peserta_wanita: { type: integer, nullable: true }
        peserta_remaja: { type: integer, nullable: true }
        peserta_lansia: { type: integer, nullable: true }
        peserta_disabilitas: { type: integer, nullable: true }

    KawasanKonservasi:
      type: object
      properties:
        id: { type: integer }
        nama_kawasan: { type: string }
        id_mpa:
          type: string
          nullable: true
          description: Identifier in the national MPA register — how this area is referred to outside COAST.
          example: T393
        luas_area_dikonservasi: { type: number, format: double }
        pelaksana_konservasi: { type: string, nullable: true }

    # -- External: IKAN ------------------------------------------------------
    FilterOption:
      type: object
      properties:
        value: { type: string, example: SULAWESI SELATAN }
        jumlah_trip:
          type: integer
          description: >
            Trips this option still covers under the filters already chosen —
            trips, not rows. A trip that measured the same species three times
            counts once.
          example: 2536

    CatchChart:
      type: object
      properties:
        filter:
          type: object
          description: The request echoed back, so a cached response stays explicable without its URL.
          properties:
            dari: { type: string, format: date, nullable: true }
            sampai: { type: string, format: date, nullable: true }
          additionalProperties: { type: string }
        unit:
          type: string
          description: Always `kg`. Stated because the upstream column declares no unit of its own.
          example: kg
        total_catch: { type: number, format: double, example: 15784681.3 }
        per_spesies:
          type: array
          description: >
            Heaviest first, name as tie-break, unpaginated — 401 species, and a
            chart wants them in one piece. A species whose every row has no
            recorded weight is omitted rather than reported as `0`, which would
            claim it was weighed and found empty.
          items:
            type: object
            properties:
              spesies: { type: string, example: Katsuwonus pelamis }
              total_catch: { type: number, format: double, example: 8312805 }

    HiupariLengthFrequency:
      type: object
      properties:
        filter:
          type: object
          additionalProperties: { type: string }
        jenis_ukuran:
          type: string
          description: The measurement actually used, echoed back including when it came from the default.
          example: panjang_total
        unit:
          type: string
          description: Always `cm`. Upstream records no unit; measurements run 5-392.
          example: cm
        selang_kelas: { type: number, format: double, example: 10 }
        ringkasan:
          type: object
          description: Computed from the rows, not the bins. Every field but the two counts is null when nothing matched.
          properties:
            jumlah_individu:
              type: integer
              description: Animals carrying the chosen measurement — the population the histogram is drawn from.
              example: 21
            jumlah_tanpa_ukuran:
              type: integer
              description: >
                Animals in scope that carry no value for the chosen
                measurement. **Read this before the chart.** For Prionace
                glauca at `panjang_total` it is 226 against 21 measured, and a
                histogram of 21 animals looks exactly like one of 247.
              example: 226
            panjang_min: { type: number, format: double, nullable: true }
            panjang_maks: { type: number, format: double, nullable: true }
            rata_rata: { type: number, format: double, nullable: true }
            median: { type: number, format: double, nullable: true }
            modus: { type: number, format: double, nullable: true }
        kematangan_matang:
          type: integer
          description: The clasper stage actually used, echoed back including when it came from the default.
          example: 3
        ketersediaan_ukuran:
          type: array
          description: >
            How many animals in scope carry each of the five measurements, most
            complete first — so a caller looking at 21 blue sharks can see that
            predorsal length would have given them 88.
          items:
            type: object
            properties:
              jenis_ukuran: { type: string, example: predorsal_length }
              jumlah_individu: { type: integer, example: 88 }
        indikator:
          type: object
          properties:
            linf:
              type: number
              format: double
              nullable: true
              description: >
                Asymptotic length by the empirical Froese & Binohlan relation,
                Lmax / 0.95 — a rule of thumb, not a von Bertalanffy fit. It
                rests on a single extreme value, and it follows the selection
                rather than the species: male Rhynchobatus australiae give 300,
                females 353,68. The relation was established for total length,
                so applied to another measurement it is an asymptote of that
                measurement rather than of the animal.
            linf_metode: { type: string }
            lm:
              type: number
              format: double
              nullable: true
              description: >
                Length at which half the males have reached the clasper stage
                given by `kematangan_matang`, interpolated between the two
                bracketing class midpoints, classes under ten individuals
                skipped. **Null unless `jenis_kelamin=M`**: clasper maturity is
                a male character, and 12.091 of the 12.108 females upstream
                carry a 0 meaning "no claspers" rather than "immature".
            lm_metode:
              type: string
              description: States how Lm was derived, or why it is null.
            persen_matang: { type: number, format: double, nullable: true }
        kelas:
          type: array
          description: Contiguous from smallest to largest observed, empty classes included.
          items:
            type: object
            properties:
              batas_bawah: { type: number, format: double }
              batas_atas: { type: number, format: double }
              nilai_tengah: { type: number, format: double }
              jumlah: { type: integer }
              jumlah_matang:
                type: integer
                nullable: true
                description: Males in this class at or above `kematangan_matang`. Null unless the selection is male-only.
              persen: { type: number, format: double }
              kumulatif_persen: { type: number, format: double }
              persen_matang: { type: number, format: double, nullable: true }

    BscCatchChart:
      type: object
      properties:
        filter:
          type: object
          additionalProperties: { type: string }
        unit:
          type: string
          description: >
            Always `gram`. Upstream records no unit; a mean of about 145 over
            46.093 crabs with a maximum of 1.800 is grams.
          example: gram
        total_bobot: { type: number, format: double }
        per_spesies:
          type: array
          description: >
            Heaviest first, name as tie-break, unpaginated — seven species. A
            species whose every individual went unweighed is omitted rather
            than reported at zero.
          items:
            type: object
            properties:
              spesies: { type: string, example: Portunus pelagicus }
              total_bobot: { type: number, format: double }

    BscLengthFrequency:
      type: object
      properties:
        filter:
          type: object
          additionalProperties: { type: string }
        unit: { type: string, example: cm }
        selang_kelas: { type: number, format: double, example: 1 }
        tkg_matang:
          type: integer
          description: The maturity threshold actually used, echoed back including when it came from the default.
          example: 2
        ringkasan:
          type: object
          description: Computed from the rows, not the bins. Every field is null when nothing matched.
          properties:
            jumlah_individu: { type: integer }
            lebar_min: { type: number, format: double, nullable: true }
            lebar_maks: { type: number, format: double, nullable: true }
            rata_rata: { type: number, format: double, nullable: true }
            median: { type: number, format: double, nullable: true }
            modus: { type: number, format: double, nullable: true }
            tanpa_tkg:
              type: integer
              description: >
                Crabs with no gonad stage recorded. They count as not mature,
                so this bounds how far the maturity figures can be trusted.
        komposisi_jenis_kelamin:
          type: array
          description: >
            Always present. Sex is written four ways upstream — JANTAN/M/L and
            BETINA/F/P — and 83 rows in none of them; those come back as null.
          items:
            type: object
            properties:
              jenis_kelamin: { type: string, nullable: true, example: BETINA }
              jumlah: { type: integer }
        indikator:
          type: object
          properties:
            lc:
              type: number
              format: double
              nullable: true
              description: >
                Width at 50% of the cumulative frequency of the ascending limb,
                interpolated within its class. A descriptive estimate, not a
                fitted selectivity ogive.
            lc_metode: { type: string }
            lm:
              type: number
              format: double
              nullable: true
              description: >
                Width at which the mature proportion first crosses half,
                interpolated between the two class midpoints that bracket it.
                Classes with fewer than ten individuals are skipped: at the
                tails three crabs can read 100% and would drag Lm to wherever
                the data is sparsest. Null when no class reaches half — which
                is what `tkg_matang=3` produces on the current data.
            lm_metode: { type: string }
            persen_matang: { type: number, format: double, nullable: true }
        kelas:
          type: array
          description: Contiguous from smallest to largest observed, empty classes included.
          items:
            type: object
            properties:
              batas_bawah: { type: number, format: double }
              batas_atas: { type: number, format: double }
              nilai_tengah: { type: number, format: double }
              jumlah: { type: integer }
              jumlah_matang:
                type: integer
                description: Crabs in this class at or above `tkg_matang` — enough to plot the maturity ogive and check Lm.
              persen: { type: number, format: double }
              kumulatif_persen: { type: number, format: double }
              persen_matang: { type: number, format: double, nullable: true }

    LengthFrequency:
      type: object
      properties:
        filter:
          type: object
          description: The request echoed back, so a cached response stays explicable without its URL.
          additionalProperties: { type: string }
        unit:
          type: string
          description: >
            Always `cm`. Upstream records no unit; measurements run 3-150 with a
            mean of 23.7, which is centimetres for fish.
          example: cm
        selang_kelas: { type: number, format: double, example: 2 }
        ringkasan:
          type: object
          description: >
            Computed from the rows, not from the bins — changing `selang_kelas`
            moves `median`, `modus` and `lc`, but never the count, the extremes
            or the mean. Every field is null when nothing matched.
          properties:
            jumlah_ikan: { type: integer, example: 8439 }
            panjang_min: { type: number, format: double, nullable: true }
            panjang_maks: { type: number, format: double, nullable: true }
            rata_rata: { type: number, format: double, nullable: true }
            median: { type: number, format: double, nullable: true }
            modus:
              type: number
              format: double
              nullable: true
              description: Midpoint of the most populated class.
        komposisi_tipe_panjang:
          type: array
          description: >
            Always present. A histogram that mixes fork length with total length
            is measuring two different things — an FL of 20 and a TL of 20 are
            not the same fish — and several species are recorded both ways, so
            the composition belongs in the response rather than in a footnote.
            `null` is the 311 upstream rows that record no type.
          items:
            type: object
            properties:
              tipe_panjang: { type: string, nullable: true, example: FL }
              jumlah: { type: integer, example: 8439 }
        indikator:
          type: object
          properties:
            lc:
              type: number
              format: double
              nullable: true
              description: >
                Length at first capture, as a **descriptive estimate**: the
                length at 50% of the cumulative frequency of the ascending limb
                (classes up to and including the modal one), interpolated within
                its class. Not a fitted selectivity ogive, which would need the
                gear's own selection data.
            lc_metode:
              type: string
              description: States how `lc` was derived, so the figure cannot be mistaken for a logistic fit.
            lm:
              type: number
              format: double
              nullable: true
              description: >
                Echoed back from the request. Length at maturity is a biological
                parameter of a species, not something a length-frequency sample
                reveals, and no table in this database holds it — so it is an
                input, taken from the literature for the species filtered to.
            persen_di_bawah_lm:
              type: number
              format: double
              nullable: true
              description: >
                Share of measured fish shorter than `lm`, counted exactly rather
                than interpolated from the classes. Null when `lm` was not
                supplied. `lc` below `lm` means the fishery takes fish before
                they have spawned.
        kelas:
          type: array
          description: >
            Contiguous from the smallest observed class to the largest, empty
            ones included — a gap in the axis reads as a bimodal distribution
            rather than as one missing bar.
          items:
            type: object
            properties:
              batas_bawah: { type: number, format: double, example: 30 }
              batas_atas: { type: number, format: double, example: 32 }
              nilai_tengah: { type: number, format: double, example: 31 }
              jumlah: { type: integer, example: 1184 }
              persen: { type: number, format: double, example: 14.03 }
              kumulatif_persen: { type: number, format: double, example: 52.71 }

    TripChart:
      type: object
      properties:
        filter:
          type: object
          description: The request echoed back, so a cached response stays explicable without its URL.
          properties:
            tipe_tanggal: { type: string, enum: [monthly, yearly] }
            dari: { type: string, format: date, nullable: true }
            sampai: { type: string, format: date, nullable: true }
          additionalProperties: { type: string }
        total_trip: { type: integer, example: 1209 }
        per_tanggal:
          type: array
          description: >
            Oldest first. Empty periods are filled with `0` **only when both
            `dari` and `sampai` are given** — a bounded range is what a line
            chart needs, whereas filling an unbounded one would stretch from a
            single 2004 trip to today: 271 months, 212 of them empty.
          items:
            type: object
            properties:
              periode:
                type: string
                description: '`YYYY-MM` when monthly, `YYYY` when yearly.'
                example: '2025-01'
              jumlah_trip: { type: integer, example: 102 }
        per_lokasi_pendaratan:
          type: array
          description: >
            Ordered alphabetically by landing site — the same order
            `opsi/lokasi-pendaratan` returns, so the chart axis and the dropdown
            that filters it agree.
          items:
            type: object
            properties:
              lokasi_pendaratan: { type: string, example: PPI UJONG BAROH }
              jumlah_trip: { type: integer, example: 445 }

    StscSeries:
      type: array
      description: >
        One line per WPPNRI, area codes in natural order. Points are emitted
        only for years that carry a row — a gap is a year nobody reported, not
        a year with no fleet.
      items:
        type: object
        properties:
          wpp: { type: string, example: '571' }
          titik:
            type: array
            items:
              type: object
              properties:
                tahun: { type: integer, example: 2021 }
                nilai: { type: number, format: double, example: 59840 }

    StscArmadaChart:
      type: object
      properties:
        filter:
          type: object
          properties:
            wpp: { type: string, nullable: true }
            dari_tahun: { type: integer, nullable: true }
            sampai_tahun: { type: integer, nullable: true }
        unit:
          type: object
          description: >
            Upstream states no unit for either column. `armada` counts vessels;
            `total_GT` is gross tonnage, consistent with the magnitudes
            recorded (about 5 GT per vessel across the whole table).
          properties:
            armada: { type: string, example: unit }
            gt: { type: string, example: GT }
        tahun:
          type: array
          description: >
            The shared x-axis: every year covered by the selection, ascending,
            so a client drawing eleven lines need not work out their union.
          items: { type: integer }
          example: [2019, 2020, 2021]
        armada: { $ref: '#/components/schemas/StscSeries' }
        gt: { $ref: '#/components/schemas/StscSeries' }
      description: >
        No grand total for either series, deliberately: both are stocks counted
        afresh every year, and summing 1990 through 2021 would report a fleet
        larger than any that ever existed. Production, a flow, is totalled.

    StscProduksiChart:
      type: object
      properties:
        filter:
          type: object
          properties:
            wpp: { type: string, nullable: true }
            komoditas: { type: string, nullable: true }
            dari_tahun: { type: integer, nullable: true }
            sampai_tahun: { type: integer, nullable: true }
        unit: { type: string, example: ton }
        tahun:
          type: array
          items: { type: integer }
          example: [2019, 2020, 2021]
        total_produksi_ton:
          type: number
          format: double
          description: Tonnage landed across the whole selection. Production is a flow, so this sum is meaningful.
          example: 317463.64
        komoditas:
          type: array
          description: Alphabetical, matching `opsi/komoditas`.
          items:
            type: object
            properties:
              komoditas: { type: string, example: Rajungan }
              total_produksi_ton: { type: number, format: double, example: 317463.64 }
              seri: { $ref: '#/components/schemas/StscSeries' }
